[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-actor-monitor"
version = "0.1.0"
description = "Treatment-aware runtime monitoring for evidence-using multimodal actors"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "AIGC Actor Monitor contributors"}]
dependencies = []

[project.scripts]
actor-monitor-eval = "actor_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

